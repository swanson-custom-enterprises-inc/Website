<style>

/* -------------------------
MENU BUTTON
------------------------- */

#menuButton{
position:fixed;
top:20px;

background:rgba(0,0,0,0.75);
color:white;

border:none;
border-radius:10px;

padding:12px 16px;

font-size:1.3rem;
cursor:pointer;

backdrop-filter:blur(10px);
}

/* -------------------------
SIDEBAR
------------------------- */

#sidebar{
position:fixed;
top:0;
left:0;

width:260px;
height:100%;

background:rgba(0,0,0,0.94);

padding:90px 25px;

z-index:2500;

transition:transform 0.35s ease;
}

/* CLOSED STATE */

#sidebar.closed{

}

/* LINKS */

#sidebar a{
display:block;

margin:18px 0;

color:white;
text-decoration:none;

opacity:0.85;

transition:0.2s;
}

#sidebar a:hover{

}

</a>
